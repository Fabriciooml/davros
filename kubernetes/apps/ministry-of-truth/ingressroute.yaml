apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ministry-of-truth
  namespace: ministry-of-truth
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`news.local.fabriciooml.dev`)
      kind: Rule
      services:
        - name: ministry-of-truth
          port: 80
  tls: {}
