apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: ministry-of-truth
  namespace: flux-system
spec:
  image: ghcr.io/fabriciooml/ministry_of_truth
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: ministry-of-truth
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: ministry-of-truth
  filterTags:
    pattern: '^main$'
  policy:
    alphabetical:
      order: asc
  digestReflectionPolicy: Always
  interval: 5m
