apiVersion: v1
kind: Namespace
metadata:
  name: overseerr
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ephemeral-storage-defaults
  namespace: overseerr
spec:
  limits:
    - type: Container
      defaultRequest:
        ephemeral-storage: 100Mi
      default:
        ephemeral-storage: 2Gi
