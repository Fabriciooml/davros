apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
  - homepage-secrets.sops.yaml
configMapGenerator:
  - name: homepage
    namespace: homepage
    files:
      - config/settings.yaml
      - config/services.yaml
      - config/widgets.yaml
      - config/bookmarks.yaml
      - config/docker.yaml
      - config/kubernetes.yaml
      - config/proxmox.yaml
      - config/custom.css
      - config/custom.js
