- Calendar:
    - Calendar:
        icon: mdi-calendar
        widget:
          type: calendar
          view: monthly
          maxEvents: 10
          showTime: true
          firstDayInWeek: sunday
          timezone: America/Sao_Paulo
          integrations:
            - type: sonarr
              service_group: Requests and automation
              service_name: Sonarr
            - type: radarr
              service_group: Requests and automation
              service_name: Radarr
- Media:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.local.fabriciooml.dev
        siteMonitor: http://jellyfin.jellyfin.svc.cluster.local:8096
        widget:
          type: jellyfin
          url: http://jellyfin.jellyfin.svc.cluster.local:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
