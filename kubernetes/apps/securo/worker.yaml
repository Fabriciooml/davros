apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: securo
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-schema
          image: ghcr.io/securo-finance/securo-backend:0.23.0@sha256:13e9187d2a89f9724776df4ebb92afa56d159eb947ca57cb8c7d1e5d6f6d1277
          command: ["sh", "-c", "until alembic current --check-heads; do echo waiting for migrations; sleep 3; done"]
          envFrom:
            - configMapRef:
                name: securo-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securo-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: securo-secrets
                  key: SECRET_KEY
            - name: PLUGGY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: securo-secrets
                  key: PLUGGY_CLIENT_ID
            - name: PLUGGY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: securo-secrets
                  key: PLUGGY_CLIENT_SECRET
            - name: DATABASE_URL
              value: postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@db:5432/securo
      containers:
        - name: celery-worker
          image: ghcr.io/securo-finance/securo-backend:0.23.0@sha256:13e9187d2a89f9724776df4ebb92afa56d159eb947ca57cb8c7d1e5d6f6d1277
          command: ["celery", "-A", "app.worker", "worker", "--loglevel=info", "--concurrency=2"]
          envFrom:
            - configMapRef:
                name: securo-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: securo-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: securo-secrets
                  key: SECRET_KEY
            - name: PLUGGY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: securo-secrets
                  key: PLUGGY_CLIENT_ID
            - name: PLUGGY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: securo-secrets
                  key: PLUGGY_CLIENT_SECRET
            - name: DATABASE_URL
              value: postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@db:5432/securo
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: attachments
              mountPath: /app/data/attachments
            - name: backups
              mountPath: /app/data/backups
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: securo-attachments
        - name: backups
          persistentVolumeClaim:
            claimName: securo-backups
---
