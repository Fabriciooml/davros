apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mapa
  namespace: mapa
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mapa.local.fabriciooml.dev`) || Host(`mapa.fabriciooml.dev`)
      kind: Rule
      services:
        - name: frontend
          port: 80
  tls: {}
