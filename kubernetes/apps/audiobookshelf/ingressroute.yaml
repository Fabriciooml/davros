apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`audiobookshelf.local.fabriciooml.dev`) || Host(`audiobooks.fabriciooml.dev`)
      kind: Rule
      services:
        - name: audiobookshelf
          port: 80
  tls: {}
