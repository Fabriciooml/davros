apiVersion: batch/v1
kind: CronJob
metadata:
  name: configarr
  namespace: arr
spec:
  suspend: true
  schedule: "0 4 * * 0"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          enableServiceLinks: false
          restartPolicy: Never
          containers:
            - name: configarr
              image: ghcr.io/raydak-labs/configarr:1.30.1@sha256:8bc6f47e3a22277eeb38927678a1299665e1c129b49c57cf9ec9f75ba8924cd6
              tty: true
              env:
                - name: TZ
                  value: America/Sao_Paulo
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: repos
                  mountPath: /app/repos
                - name: config
                  mountPath: /app/config/config.yml
                  subPath: config.yml
                  readOnly: true
                - name: secrets
                  mountPath: /app/config/secrets.yml
                  subPath: secrets.yml
                  readOnly: true
          volumes:
            - name: repos
              persistentVolumeClaim:
                claimName: configarr-repos
            - name: config
              configMap:
                name: configarr-config
            - name: secrets
              secret:
                secretName: configarr-secrets
