telemetry: false
sonarr:
  instance1:
    base_url: http://sonarr.arr.svc.cluster.local:8989
    api_key: !secret SONARR_API_KEY
    root_folders:
      - /data/media/tv
    quality_definition:
      type: series
    include:
      - template: sonarr-cf
      - template: sonarr-quality
      - template: d1498e7d189fbe6c7110ceaabb7473e6
        source: TRASH
      - template: sonarr-quality-definition-series
      - template: sonarr-v4-quality-profile-web-1080p
      - template: sonarr-v4-custom-formats-web-1080p
    custom_format_groups:
      - trash_guide:
          - id: c4735e1d02e8738044ad4ad1bf58670c
        assign_scores_to:
          - name: WEB-1080p
    custom_formats:
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb
        assign_scores_to:
          - name: WEB-1080p
            score: 0
      - trash_ids:
          - a3d82cbef5039f8d295478d28a887159
          - 2b239ed870daba8126a53bd5dc8dc1c8
        assign_scores_to:
          - name: WEB-1080p
            score: -10000
      - trash_ids:
          - example-in-config-cf
        assign_scores_to:
          - name: WEB-1080p
            score: -5000
    quality_profiles:
      - name: WEB-1080p
        upgrade:
          min_format_score: 10000
    media_naming:
      series: default
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default
radarr:
  instance1:
    base_url: http://radarr.arr.svc.cluster.local:7878
    api_key: !secret RADARR_API_KEY
    quality_definition:
      type: movie
    include:
      - template: radarr-quality-definition-movie
      - template: radarr-quality-profile-hd-bluray-web
      - template: radarr-custom-formats-hd-bluray-web
    custom_formats:
      - trash_ids:
          - 9f6cbff8cfe4ebbc1bde14c7b7bec0de
        assign_scores_to:
          - name: HD Bluray + WEB
            score: 0
    quality_profiles:
      - name: HD Bluray + WEB
        language: Any
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Remux-1080p
          until_score: 10000
          min_format_score: 100
        min_format_score: 100
        qualities:
          - name: Remux-1080p
            qualities:
              - Bluray-1080p
              - Remux-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities:
              - WEBDL-480p
              - WEBRip-480p
          - name: DVD
          - name: SDTV
    root_folders:
      - /data/media/movies
    media_naming:
      folder: default
      movie:
        rename: true
        standard: standard
