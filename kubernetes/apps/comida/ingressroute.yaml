apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: comida
  namespace: comida
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`comida.local.fabriciooml.dev`) || Host(`butecos.fabriciooml.dev`)
      kind: Rule
      services:
        - name: comida
          port: 80
  tls: {}
