apiVersion: apps/v1
kind: Deployment
metadata:
  name: comida
  namespace: comida
spec:
  replicas: 0
  progressDeadlineSeconds: 1200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comida
  template:
    metadata:
      labels:
        app: comida
      annotations:
        fabriciooml.dev/image-digest: sha256:249661cea04f712d9a1208baa3a0aaaf083f4c7eb4614cefb3dfccd2eabf9f83 # {"$imagepolicy": "flux-system:comida:digest"}
    spec:
      enableServiceLinks: false
      containers:
        - name: comida
          image: ghcr.io/fabriciooml/comida_di_buteco_tracker:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DB_PATH
              value: /app/data/butecos.db
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 15
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: comida-data
