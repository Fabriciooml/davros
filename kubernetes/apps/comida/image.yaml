apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: comida
  namespace: flux-system
spec:
  image: ghcr.io/fabriciooml/comida_di_buteco_tracker
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: comida
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: comida
  filterTags:
    pattern: '^main$'
  policy:
    alphabetical:
      order: asc
  digestReflectionPolicy: Always
  interval: 5m
