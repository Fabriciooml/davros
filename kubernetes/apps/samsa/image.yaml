apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: samsa
  namespace: flux-system
spec:
  image: ghcr.io/fabriciooml/samsa
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: samsa
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: samsa
  filterTags:
    pattern: '^latest$'
  policy:
    alphabetical:
      order: asc
  digestReflectionPolicy: Always
  interval: 5m
