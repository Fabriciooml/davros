apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookrequest
  namespace: arr
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiobookrequest
  template:
    metadata:
      labels:
        app: audiobookrequest
    spec:
      enableServiceLinks: false
      containers:
        - name: audiobookrequest
          image: markbeep/audiobookrequest:1.11.0@sha256:628080b8bc71d057927ec26109eb3135f5ce6678a541077cb5b8d13fbe9fca43
          env:
            - name: TZ
              value: America/Sao_Paulo
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: audiobookrequest-config
