apiVersion: v1
kind: Service
metadata:
  name: couchdb
  namespace: legacy-routes
spec:
  ports:
    - name: http
      port: 5984
      targetPort: 5984
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: couchdb
  namespace: legacy-routes
  labels:
    kubernetes.io/service-name: couchdb
addressType: IPv4
ports:
  - name: http
    port: 5984
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.31.226
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: couchdb
  namespace: legacy-routes
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`obsidian.local.fabriciooml.dev`)
      services:
        - name: couchdb
          port: 5984
  tls: {}
