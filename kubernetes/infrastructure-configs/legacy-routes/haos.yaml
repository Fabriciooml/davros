apiVersion: v1
kind: Service
metadata:
  name: haos
  namespace: legacy-routes
spec:
  ports:
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: haos
  namespace: legacy-routes
  labels:
    kubernetes.io/service-name: haos
addressType: IPv4
ports:
  - name: http
    port: 8123
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.31.128
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: haos
  namespace: legacy-routes
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`haos.local.fabriciooml.dev`)
      services:
        - name: haos
          port: 8123
  tls: {}
