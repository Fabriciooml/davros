apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: legacy-routes
spec:
  ports:
    - name: http
      port: 32400
      targetPort: 32400
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: plex
  namespace: legacy-routes
  labels:
    kubernetes.io/service-name: plex
addressType: IPv4
ports:
  - name: http
    port: 32400
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.31.83
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex
  namespace: legacy-routes
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`plex.local.fabriciooml.dev`)
      services:
        - name: plex
          port: 32400
  tls: {}
