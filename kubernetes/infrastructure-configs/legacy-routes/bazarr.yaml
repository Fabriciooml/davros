apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: legacy-routes
spec:
  ports:
    - name: http
      port: 6767
      targetPort: 6767
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: bazarr
  namespace: legacy-routes
  labels:
    kubernetes.io/service-name: bazarr
addressType: IPv4
ports:
  - name: http
    port: 6767
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.31.226
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bazarr
  namespace: legacy-routes
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`bazarr.local.fabriciooml.dev`)
      services:
        - name: bazarr
          port: 6767
  tls: {}
