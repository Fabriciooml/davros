apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: legacy-routes
spec:
  ports:
    - name: http
      port: 7878
      targetPort: 7878
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: radarr
  namespace: legacy-routes
  labels:
    kubernetes.io/service-name: radarr
addressType: IPv4
ports:
  - name: http
    port: 7878
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.31.226
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr
  namespace: legacy-routes
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`radarr.local.fabriciooml.dev`)
      services:
        - name: radarr
          port: 7878
  tls: {}
