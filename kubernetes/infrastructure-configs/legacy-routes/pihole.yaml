apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: legacy-routes
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pihole
  namespace: legacy-routes
  labels:
    kubernetes.io/service-name: pihole
addressType: IPv4
ports:
  - name: http
    port: 80
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.31.152
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole
  namespace: legacy-routes
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`pihole.local.fabriciooml.dev`)
      services:
        - name: pihole
          port: 80
  tls: {}
