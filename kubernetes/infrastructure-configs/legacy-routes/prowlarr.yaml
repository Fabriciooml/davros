apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: legacy-routes
spec:
  ports:
    - name: http
      port: 9696
      targetPort: 9696
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: prowlarr
  namespace: legacy-routes
  labels:
    kubernetes.io/service-name: prowlarr
addressType: IPv4
ports:
  - name: http
    port: 9696
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.31.226
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr
  namespace: legacy-routes
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`prowlarr.local.fabriciooml.dev`)
      services:
        - name: prowlarr
          port: 9696
  tls: {}
