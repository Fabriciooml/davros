apiVersion: v1
kind: Service
metadata:
  name: proxmox
  namespace: legacy-routes
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox
  namespace: legacy-routes
  labels:
    kubernetes.io/service-name: proxmox
addressType: IPv4
ports:
  - name: https
    port: 8006
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.31.42
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox
  namespace: legacy-routes
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`proxmox.local.fabriciooml.dev`)
      services:
        - name: proxmox
          port: 8006
          scheme: https
          serversTransport: insecure-skip-verify
  tls: {}
