apiVersion: v1
kind: Service
metadata:
  name: overseerr
  namespace: legacy-routes
spec:
  ports:
    - name: http
      port: 5055
      targetPort: 5055
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: overseerr
  namespace: legacy-routes
  labels:
    kubernetes.io/service-name: overseerr
addressType: IPv4
ports:
  - name: http
    port: 5055
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.31.226
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: overseerr
  namespace: legacy-routes
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`requester.local.fabriciooml.dev`)
      services:
        - name: overseerr
          port: 5055
  tls: {}
