apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: legacy-routes
spec:
  ports:
    - name: https
      port: 8000
      targetPort: 8000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: vaultwarden
  namespace: legacy-routes
  labels:
    kubernetes.io/service-name: vaultwarden
addressType: IPv4
ports:
  - name: https
    port: 8000
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.31.108
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: legacy-routes
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`vault.local.fabriciooml.dev`)
      services:
        - name: vaultwarden
          port: 8000
          scheme: https
          serversTransport: insecure-skip-verify
  tls: {}
