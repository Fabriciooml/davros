apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: legacy-routes
spec:
  ports:
    - name: http
      port: 8096
      targetPort: 8096
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jellyfin
  namespace: legacy-routes
  labels:
    kubernetes.io/service-name: jellyfin
addressType: IPv4
ports:
  - name: http
    port: 8096
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.31.40
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: legacy-routes
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`jellyfin.local.fabriciooml.dev`)
      services:
        - name: jellyfin
          port: 8096
  tls: {}
