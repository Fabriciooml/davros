apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: 'chore(images): {{range .Changed.Changes}}{{.OldValue}} -> {{.NewValue}} {{end}}'
    push:
      branch: main
  update:
    path: ./kubernetes/apps
    strategy: Setters
