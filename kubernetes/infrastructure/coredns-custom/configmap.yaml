apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  cluster-local-search.server: |
    cluster.local.fabriciooml.dev:53 {
        template ANY ANY {
            rcode NXDOMAIN
        }
    }
  fabriciooml-search.server: |
    local.fabriciooml.dev:53 {
        forward . /etc/resolv.conf
        cache 30
    }
    fabriciooml.dev:53 {
        template ANY ANY {
            match "^[^.]+[.].+[.]fabriciooml[.]dev[.]$"
            rcode NXDOMAIN
        }
        forward . /etc/resolv.conf
        cache 30
    }
