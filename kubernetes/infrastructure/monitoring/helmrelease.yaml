apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.10.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    alertmanager:
      enabled: false

    grafana:
      admin:
        existingSecret: grafana-admin-credentials
      persistence:
        enabled: true
        type: sts
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        size: 1Gi
      resources:
        requests:
          cpu: 75m
          memory: 256Mi
        limits:
          memory: 512Mi
      livenessProbe:
        httpGet:
          path: /api/health
          port: 3000
        initialDelaySeconds: 1800
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 30
      readinessProbe:
        httpGet:
          path: /api/health
          port: 3000
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 30

    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - action: drop
            regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
            sourceLabels:
              - __name__
              - le
          - action: drop
            regex: (apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes)_bucket
            sourceLabels:
              - __name__

    kubelet:
      serviceMonitor:
        metricRelabelings:
          - action: drop
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
            sourceLabels:
              - __name__
              - le
          - action: drop
            regex: (apiserver|etcd|aggregator|apiextensions)_.*
            sourceLabels:
              - __name__

    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          memory: 64Mi

    prometheus:
      prometheusSpec:
        retention: 15d
        resources:
          requests:
            cpu: 150m
            memory: 1Gi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
