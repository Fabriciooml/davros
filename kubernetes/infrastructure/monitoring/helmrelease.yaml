apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    alertmanager:
      enabled: false

    grafana:
      admin:
        existingSecret: grafana-admin-credentials
      persistence:
        enabled: true
        type: sts
        storageClassName: nfs-appdata
        accessModes:
          - ReadWriteOnce
        size: 1Gi
      resources:
        requests:
          cpu: 75m
          memory: 192Mi
        limits:
          memory: 256Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 25m
          memory: 48Mi
        limits:
          memory: 64Mi

    prometheus:
      prometheusSpec:
        retention: 15d
        resources:
          requests:
            cpu: 150m
            memory: 512Mi
          limits:
            memory: 768Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-appdata
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
