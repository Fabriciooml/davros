apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 42.0.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    service:
      type: LoadBalancer
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: false
    api:
      dashboard: true
      insecure: false
    ingressRoute:
      dashboard:
        enabled: false
